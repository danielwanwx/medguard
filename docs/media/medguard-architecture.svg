<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">MedGuard — evidence before decisions</title>
  <desc id="desc">A local-first architecture flow. A person confirms a supplement label in a React app, which sends validated context to a request-local Strands agent on Amazon Bedrock Nova Pro. The agent invokes four live or curated evidence tools. Structured evidence, an actual trace, and an incomplete gate feed a dated review and a local pharmacist note.</desc>

  <defs>
    <marker id="arrow-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#214c3d"/>
    </marker>
    <marker id="arrow-sage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b8772"/>
    </marker>
    <marker id="arrow-peach" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bd765e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#214c3d" flood-opacity="0.08"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #214c3d; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.7px; }
      .title { font-size: 42px; font-weight: 700; letter-spacing: -0.8px; }
      .subtitle { font-size: 18px; font-weight: 400; fill: #4f6c5d; }
      .legend { font-size: 12px; font-weight: 700; letter-spacing: 0.9px; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .node-title { font-size: 21px; font-weight: 700; letter-spacing: -0.2px; }
      .node-subtitle { font-size: 15px; font-weight: 400; fill: #4f6c5d; }
      .node-meta { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; }
      .node-title-light { font-size: 21px; font-weight: 700; letter-spacing: -0.2px; fill: #fffdf8; }
      .node-subtitle-light { font-size: 15px; font-weight: 400; fill: #dce8b0; }
      .small-light { font-size: 13px; font-weight: 400; fill: #f8f6ee; }
      .node-meta-light { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; fill: #dce8b0; }
      .arrow-label { font-size: 12px; font-weight: 600; fill: #527264; }
      .tool-title { font-size: 17px; font-weight: 700; }
      .tool-subtitle { font-size: 14px; font-weight: 400; fill: #4f6c5d; }
      .small { font-size: 13px; font-weight: 400; fill: #557366; }
      .small-strong { font-size: 13px; font-weight: 700; fill: #214c3d; }
      .footer { font-size: 13px; font-weight: 600; fill: #214c3d; }
      .mono { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #527264; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1440" height="960" fill="#f8f6ee"/>
  <circle cx="1357" cy="38" r="150" fill="#dce8b0" opacity="0.38"/>
  <circle cx="85" cy="835" r="190" fill="#f0d4bf" opacity="0.18"/>

  <!-- Header -->
  <text x="80" y="55" class="eyebrow" fill="#6b8772">MEDGUARD · SYSTEM ARCHITECTURE</text>
  <text x="80" y="106" class="title">MedGuard — evidence before decisions</text>
  <text x="80" y="139" class="subtitle">The model orchestrates. Official records and cited rules own the evidence. A person decides what to bring to a pharmacist.</text>

  <!-- Legend -->
  <g transform="translate(80 166)">
    <rect x="0" y="0" width="1280" height="35" rx="17.5" fill="#fffdf8" stroke="#e4e6d9" stroke-width="1.5"/>
    <circle cx="22" cy="17.5" r="7" fill="#f0d4bf" stroke="#bd765e" stroke-width="1.5"/>
    <text x="38" y="22" class="legend">HUMAN AUTHORITY</text>
    <circle cx="255" cy="17.5" r="7" fill="#214c3d"/>
    <text x="271" y="22" class="legend">MODEL ORCHESTRATION</text>
    <circle cx="530" cy="17.5" r="7" fill="#dce8b0" stroke="#6b8772" stroke-width="1.5"/>
    <text x="546" y="22" class="legend">EVIDENCE + TRACE</text>
    <line x1="742" y1="9" x2="742" y2="26" stroke="#e4e6d9"/>
    <text x="766" y="22" class="legend" fill="#6b8772">ONE REQUEST · ONE CONTEXT · ONE TRACE</text>
  </g>

  <!-- Row 1: request flow -->
  <text x="80" y="232" class="section" fill="#6b8772">01 · REQUEST FLOW</text>

  <!-- Person -->
  <g filter="url(#shadow)">
    <rect x="80" y="252" width="280" height="166" rx="18" fill="#f0d4bf" stroke="#bd765e" stroke-width="2"/>
  </g>
  <circle cx="118" cy="292" r="21" fill="#fffaf2" stroke="#bd765e" stroke-width="1.5"/>
  <circle cx="118" cy="287" r="7" fill="none" stroke="#bd765e" stroke-width="2"/>
  <path d="M106 306c3-9 21-9 24 0" fill="none" stroke="#bd765e" stroke-width="2" stroke-linecap="round"/>
  <text x="153" y="290" class="node-meta" fill="#8e5748">HUMAN AUTHORITY</text>
  <text x="108" y="345" class="node-title">Person confirms label</text>
  <text x="108" y="376" class="node-subtitle">Compare the bottle to catalog candidates.</text>
  <text x="108" y="400" class="small-strong">The selection is explicit.</text>

  <!-- App -->
  <g filter="url(#shadow)">
    <rect x="398" y="252" width="280" height="166" rx="18" fill="#fffdf8" stroke="#214c3d" stroke-width="2"/>
  </g>
  <rect x="426" y="278" width="38" height="28" rx="6" fill="#dce8b0" stroke="#6b8772" stroke-width="1.5"/>
  <path d="M435 286h20M435 292h14M435 298h17" stroke="#214c3d" stroke-width="1.7" stroke-linecap="round"/>
  <text x="480" y="290" class="node-meta" fill="#6b8772">APP + LOCAL STORAGE</text>
  <text x="426" y="345" class="node-title">React app</text>
  <text x="426" y="376" class="node-subtitle">Local profile / cabinet</text>
  <text x="426" y="400" class="small-strong">No cloud cabinet database.</text>

  <!-- Input validation -->
  <g filter="url(#shadow)">
    <rect x="716" y="252" width="280" height="166" rx="18" fill="#dce8b0" stroke="#6b8772" stroke-width="2"/>
  </g>
  <circle cx="750" cy="292" r="20" fill="#f8f6ee" stroke="#6b8772" stroke-width="1.5"/>
  <path d="M740 293l7 7 14-16" fill="none" stroke="#214c3d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="784" y="290" class="node-meta" fill="#527264">TRUST BOUNDARY</text>
  <text x="744" y="345" class="node-title">POST + input validation</text>
  <text x="744" y="376" class="node-subtitle">Bounded text, profile, selected_id</text>
  <text x="744" y="400" class="small-strong">Fresh context and trace per request.</text>

  <!-- Agent -->
  <g filter="url(#shadow)">
    <rect x="1034" y="252" width="326" height="166" rx="18" fill="#214c3d" stroke="#214c3d" stroke-width="2"/>
  </g>
  <circle cx="1070" cy="292" r="20" fill="#dce8b0"/>
  <path d="M1060 292h20M1070 282v20M1063 285l14 14M1077 285l-14 14" stroke="#214c3d" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1104" y="290" class="node-meta-light">MODEL ORCHESTRATION</text>
  <text x="1070" y="345" class="node-title-light">Request-local Strands agent</text>
  <text x="1070" y="376" class="node-subtitle-light">Amazon Bedrock Nova Pro</text>
  <text x="1070" y="400" class="small-light">Tools receive server-owned inputs.</text>

  <!-- Row 1 arrows -->
  <path d="M360 334H388" fill="none" stroke="#214c3d" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
  <rect x="357" y="306" width="68" height="22" rx="11" fill="#f8f6ee"/>
  <text x="391" y="321" text-anchor="middle" class="arrow-label">label choice</text>

  <path d="M678 334H706" fill="none" stroke="#214c3d" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
  <rect x="674" y="306" width="101" height="22" rx="11" fill="#f8f6ee"/>
  <text x="724" y="321" text-anchor="middle" class="arrow-label">POST request</text>

  <path d="M996 334H1024" fill="none" stroke="#214c3d" stroke-width="2.5" marker-end="url(#arrow-forest)"/>
  <rect x="986" y="306" width="107" height="22" rx="11" fill="#f8f6ee"/>
  <text x="1040" y="321" text-anchor="middle" class="arrow-label">fresh context</text>

  <!-- Row 2: tools -->
  <text x="80" y="475" class="section" fill="#6b8772">02 · EVIDENCE TOOLS</text>
  <text x="272" y="475" class="small">Actual zero-argument invocations are bound to the request context.</text>

  <rect x="80" y="494" width="1280" height="170" rx="22" fill="#eef3d7" stroke="#cbd9a1" stroke-width="1.5"/>

  <!-- Agent-to-tools bus -->
  <path d="M1197 418V458H236M236 458V484" fill="none" stroke="#6b8772" stroke-width="2.2" marker-end="url(#arrow-sage)"/>
  <path d="M518 458V484M800 458V484M1082 458V484" fill="none" stroke="#6b8772" stroke-width="2.2" marker-end="url(#arrow-sage)"/>
  <rect x="1034" y="433" width="194" height="22" rx="11" fill="#f8f6ee"/>
  <text x="1131" y="448" text-anchor="middle" class="arrow-label">actual tool calls</text>

  <!-- Tool cards -->
  <g>
    <rect x="104" y="520" width="258" height="116" rx="15" fill="#fffdf8" stroke="#a8bd85" stroke-width="1.5"/>
    <circle cx="133" cy="551" r="13" fill="#dce8b0"/>
    <path d="M127 551h12M133 545v12" stroke="#214c3d" stroke-width="1.7" stroke-linecap="round"/>
    <text x="157" y="554" class="tool-title">NIH DSLD · LIVE</text>
    <text x="128" y="585" class="tool-subtitle">Catalog label candidates</text>
    <text x="128" y="609" class="small">Name, brand, ingredients</text>
  </g>

  <g>
    <rect x="386" y="520" width="258" height="116" rx="15" fill="#fffdf8" stroke="#a8bd85" stroke-width="1.5"/>
    <circle cx="415" cy="551" r="13" fill="#dce8b0"/>
    <path d="M409 546h12M409 551h12M409 556h8" stroke="#214c3d" stroke-width="1.7" stroke-linecap="round"/>
    <text x="439" y="554" class="tool-title">FDA FOOD + DRUG · LIVE</text>
    <text x="410" y="585" class="tool-subtitle">Enforcement records</text>
    <text x="410" y="609" class="small">Product, lot, status, dates</text>
  </g>

  <g>
    <rect x="668" y="520" width="258" height="116" rx="15" fill="#fffdf8" stroke="#a8bd85" stroke-width="1.5"/>
    <circle cx="697" cy="551" r="13" fill="#dce8b0"/>
    <path d="M692 544h10v14h-10zM694 547h6M694 551h6" fill="none" stroke="#214c3d" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="721" y="554" class="tool-title">NIH / NCCIH · CURATED</text>
    <text x="692" y="585" class="tool-subtitle">Interaction prompts</text>
    <text x="692" y="609" class="small">Cited rules, limited coverage</text>
  </g>

  <g>
    <rect x="950" y="520" width="258" height="116" rx="15" fill="#fffdf8" stroke="#a8bd85" stroke-width="1.5"/>
    <circle cx="979" cy="551" r="13" fill="#dce8b0"/>
    <path d="M974 545h10v13h-10zM976 548h6M976 552h6M976 556h6" fill="none" stroke="#214c3d" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="1003" y="554" class="tool-title">ODS · ADULT REFERENCES</text>
    <text x="974" y="585" class="tool-subtitle">Formulation and scope limits</text>
    <text x="974" y="609" class="small">No personalized safe-dose claim</text>
  </g>

  <!-- Evidence handoff -->
  <path d="M233 664V694H720V706" fill="none" stroke="#6b8772" stroke-width="2.2" marker-end="url(#arrow-sage)"/>
  <path d="M515 664V694M797 664V694M1079 664V694" fill="none" stroke="#6b8772" stroke-width="2.2"/>
  <rect x="519" y="673" width="184" height="22" rx="11" fill="#f8f6ee"/>
  <text x="611" y="688" text-anchor="middle" class="arrow-label">source data + status</text>

  <!-- Row 3: output contract -->
  <text x="80" y="729" class="section" fill="#6b8772">03 · OUTPUT CONTRACT</text>

  <!-- Evidence contract cluster -->
  <rect x="80" y="748" width="640" height="112" rx="18" fill="#dce8b0" stroke="#a8bd85" stroke-width="1.5"/>
  <text x="108" y="779" class="node-meta" fill="#527264">REQUEST-LOCAL RESULT</text>

  <rect x="104" y="795" width="184" height="46" rx="11" fill="#fffdf8" stroke="#a8bd85" stroke-width="1.2"/>
  <path d="M122 811h12M122 817h25M122 823h20" stroke="#6b8772" stroke-width="1.7" stroke-linecap="round"/>
  <text x="157" y="823" class="small-strong">Structured evidence</text>

  <rect x="304" y="795" width="184" height="46" rx="11" fill="#fffdf8" stroke="#a8bd85" stroke-width="1.2"/>
  <path d="M322 809h27v20h-27zM327 805h17" fill="none" stroke="#6b8772" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="357" y="823" class="small-strong">Actual trace</text>

  <rect x="504" y="795" width="184" height="46" rx="11" fill="#fffdf8" stroke="#a8bd85" stroke-width="1.2"/>
  <circle cx="524" cy="818" r="10" fill="none" stroke="#bd765e" stroke-width="1.8"/>
  <path d="M524 812v7l5 3" fill="none" stroke="#bd765e" stroke-width="1.8" stroke-linecap="round"/>
  <text x="548" y="823" class="small-strong">Incomplete gate</text>

  <!-- Human save -->
  <path d="M720 804H756" fill="none" stroke="#bd765e" stroke-width="2.4" marker-end="url(#arrow-peach)"/>
  <rect x="684" y="714" width="88" height="22" rx="11" fill="#f8f6ee"/>
  <text x="728" y="729" text-anchor="middle" class="arrow-label">review first</text>
  <g filter="url(#shadow)">
    <rect x="776" y="748" width="285" height="112" rx="18" fill="#f0d4bf" stroke="#bd765e" stroke-width="2"/>
  </g>
  <circle cx="810" cy="782" r="18" fill="#fffaf2" stroke="#bd765e" stroke-width="1.5"/>
  <path d="M801 783l6 6 11-13" fill="none" stroke="#bd765e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="839" y="781" class="node-meta" fill="#8e5748">HUMAN AUTHORITY</text>
  <text x="800" y="818" class="node-title">User saves dated review</text>
  <text x="800" y="842" class="small" fill="#70483d">Explicit browser action</text>

  <!-- Note -->
  <path d="M1061 804H1097" fill="none" stroke="#bd765e" stroke-width="2.4" marker-end="url(#arrow-peach)"/>
  <rect x="1063" y="714" width="96" height="22" rx="11" fill="#f8f6ee"/>
  <text x="1111" y="729" text-anchor="middle" class="arrow-label">local handoff</text>
  <g filter="url(#shadow)">
    <rect x="1117" y="748" width="243" height="112" rx="18" fill="#fffdf8" stroke="#214c3d" stroke-width="2"/>
  </g>
  <rect x="1143" y="779" width="22" height="28" rx="3" fill="#dce8b0" stroke="#6b8772" stroke-width="1.3"/>
  <path d="M1148 786h12M1148 792h12M1148 798h8" stroke="#214c3d" stroke-width="1.4" stroke-linecap="round"/>
  <text x="1181" y="781" class="node-meta" fill="#6b8772">LOCAL RECORD</text>
  <text x="1143" y="818" class="node-title">Pharmacist note</text>
  <text x="1143" y="842" class="small">Review, download or print</text>

  <!-- Footer boundary chips -->
  <line x1="80" y1="887" x2="1360" y2="887" stroke="#d9ded0" stroke-width="1.5"/>
  <text x="80" y="918" class="section" fill="#8e5748">BOUNDARIES</text>
  <g transform="translate(192 898)">
    <rect x="0" y="0" width="286" height="34" rx="17" fill="#fffdf8" stroke="#e0c7bb" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="7" fill="#f0d4bf" stroke="#bd765e" stroke-width="1.1"/>
    <text x="35" y="22" class="footer">No exact bottle / lot verification</text>
  </g>
  <g transform="translate(494 898)">
    <rect x="0" y="0" width="235" height="34" rx="17" fill="#fffdf8" stroke="#e0c7bb" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="7" fill="#f0d4bf" stroke="#bd765e" stroke-width="1.1"/>
    <text x="35" y="22" class="footer">No background monitoring</text>
  </g>
  <g transform="translate(745 898)">
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#f0d4bf" stroke="#bd765e" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="7" fill="#fffaf2" stroke="#bd765e" stroke-width="1.1"/>
    <text x="35" y="22" class="footer">Human / pharmacist decides</text>
  </g>
  <text x="1360" y="918" text-anchor="end" class="mono">LOCAL-FIRST · EVIDENCE-LED · HUMAN-REVIEWED</text>
</svg>
